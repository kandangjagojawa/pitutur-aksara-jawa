<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Pitutur Aksara Jawa</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Import Google Font: Libre Caslon Text -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        @font-face {
            font-family: 'NgayogyanKawi';
            src: url('ngayogyan.ttf') format('truetype');
        }
        @font-face {
            font-family: 'NgayogyanBiasa';
            src: url('ngayogyann.ttf') format('truetype');
        }
        body {
            background-color: #fcf9f2;
            color: #2d3748;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .font-kawi { font-family: 'NgayogyanKawi', sans-serif; }
        .font-biasa { font-family: 'NgayogyanBiasa', sans-serif; }
        .font-caslon { font-family: 'Libre Caslon Text', serif; }
        
        .aksara-box {
            font-size: 2.5rem;
            line-height: 1.8;
            min-height: 120px;
            word-break: break-word;
        }
        /* Kustomisasi Scrollbar untuk Dropdown */
        .custom-scrollbar::-webkit-scrollbar { width: 8px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e0; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #a0aec0; }
    </style>
</head>
<body class="flex flex-col min-h-screen">
    <!-- Header -->
    <header class="bg-amber-800 text-white p-6 shadow-md">
        <h1 class="text-3xl font-bold text-center">Pitutur Aksara Jawa</h1>
        <p class="text-center mt-2 text-amber-200">Transliterasi otomatis pitutur luhur ke dalam tiga gaya penulisan aksara</p>
    </header>

    <main class="flex-grow w-full max-w-7xl mx-auto p-6 flex flex-col items-center">
        
        <!-- Pencarian & Dropdown -->
        <div class="relative w-full max-w-2xl mb-8">
            <label for="searchInput" class="block text-sm font-semibold mb-2 text-amber-900">Pilih atau Ketik Pitutur</label>
            <div class="relative flex items-center">
                <input type="text" id="searchInput" 
                       autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false"
                       class="w-full p-4 pr-12 border-2 border-amber-300 rounded-lg shadow-sm text-lg focus:outline-none focus:border-amber-600 focus:ring-1 focus:ring-amber-600 bg-white placeholder-gray-400" 
                       placeholder="Ketik awalan kata pitutur (misal: urip, becik)...">
                
                <!-- Tombol Hapus / Clear Button -->
                <button type="button" id="clearBtn" class="absolute right-3 hidden text-gray-400 hover:text-amber-800 focus:outline-none p-2 rounded-full transition" title="Bersihkan input">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>
            </div>
            
            <!-- Dropdown List -->
            <div id="dropdownList" class="absolute z-10 w-full bg-white border border-amber-200 rounded-lg shadow-xl mt-1 hidden max-h-60 overflow-y-auto custom-scrollbar"></div>
        </div>

        <!-- Kontrol Slider (Ukuran & Spasi) -->
        <div class="w-full max-w-2xl bg-white p-6 rounded-lg shadow-md mb-8 border border-amber-100 flex flex-col sm:flex-row gap-8">
            <div class="flex-1">
                <label for="fontSizeSlider" class="block text-sm font-semibold text-gray-700 mb-2">
                    Ukuran Aksara (<span id="fontSizeVal">2.5</span>rem)
                </label>
                <input type="range" id="fontSizeSlider" min="1.5" max="5.0" step="0.1" value="2.5" class="w-full accent-amber-600">
            </div>
            <div class="flex-1">
                <label for="lineHeightSlider" class="block text-sm font-semibold text-gray-700 mb-2">
                    Spasi Baris (<span id="lineHeightVal">1.8</span>)
                </label>
                <input type="range" id="lineHeightSlider" min="1.0" max="3.5" step="0.1" value="1.8" class="w-full accent-amber-600">
            </div>
        </div>

        <!-- Area Hasil Tiga Paugeran -->
        <div class="w-full grid grid-cols-1 md:grid-cols-3 gap-6">
            
            <!-- Kotak KBJ -->
            <div class="bg-white rounded-lg shadow-md overflow-hidden border border-amber-200 flex flex-col">
                <div class="bg-amber-100 p-4 border-b border-amber-200 flex justify-between items-center">
                    <h2 class="font-bold text-amber-900">Paugeran KBJ</h2>
                    <button onclick="copyAksara('outKbj', this)" class="bg-amber-600 text-white px-3 py-1 rounded shadow-sm text-sm hover:bg-amber-700 transition">Salin</button>
                </div>
                <div class="p-6 flex-grow flex items-center justify-center bg-[#fbf9f6]">
                    <div id="outKbj" class="aksara-box font-biasa text-center w-full text-gray-800"></div>
                </div>
            </div>

            <!-- Kotak Sriwedari -->
            <div class="bg-white rounded-lg shadow-md overflow-hidden border border-amber-200 flex flex-col">
                <div class="bg-amber-100 p-4 border-b border-amber-200 flex justify-between items-center">
                    <h2 class="font-bold text-amber-900">Paugeran Sriwedari</h2>
                    <button onclick="copyAksara('outSriwedari', this)" class="bg-amber-600 text-white px-3 py-1 rounded shadow-sm text-sm hover:bg-amber-700 transition">Salin</button>
                </div>
                <div class="p-6 flex-grow flex items-center justify-center bg-[#fbf9f6]">
                    <div id="outSriwedari" class="aksara-box font-biasa text-center w-full text-gray-800"></div>
                </div>
            </div>

            <!-- Kotak Cara Kawi -->
            <div class="bg-white rounded-lg shadow-md overflow-hidden border border-amber-200 flex flex-col">
                <div class="bg-amber-100 p-4 border-b border-amber-200 flex justify-between items-center">
                    <h2 class="font-bold text-amber-900">Cara Kawi</h2>
                    <button onclick="copyAksara('outKawi', this)" class="bg-amber-600 text-white px-3 py-1 rounded shadow-sm text-sm hover:bg-amber-700 transition">Salin</button>
                </div>
                <div class="p-6 flex-grow flex items-center justify-center bg-[#fbf9f6]">
                    <div id="outKawi" class="aksara-box font-kawi text-center w-full text-gray-800"></div>
                </div>
            </div>

        </div>

        <!-- Area Daftar Semua Pitutur (Single Column dengan Pengelompokan Abjad) -->
        <div class="w-full max-w-4xl mt-12 bg-white p-6 rounded-lg shadow-md border border-amber-200 font-caslon">
            <h2 class="text-xl font-bold text-amber-900 mb-6 border-b border-amber-200 pb-2">Daftar Lengkap Pitutur Luhur</h2>
            <div id="pituturListContainer" class="flex flex-col gap-6 text-base">
                <!-- Daftar pitutur dengan header abjad akan dirender di sini via JavaScript -->
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-amber-900 text-white text-center p-5 mt-auto">
        <p class="text-sm font-light tracking-wider">Dari <span class="font-bold text-amber-400">KANDANGJAGO</span> untuk Nusantara</p>
    </footer>

    <!-- Script Logika -->
    <script>
        let pituturData = [];
        let winKbj, winSriwedari, winKawi;
        let pendingRequests = {};
        let reqId = 0;

        // Format Tampilan UI: Disambung jika ada tanda hubung, Kapital awal & kata khusus, akhiri titik
        function formatDisplayPitutur(text) {
            if (!text) return '';
            
            // 1. Hapus tanda hubung (-) tanpa spasi agar kata menyambung (misal: ninggal-a -> ninggala)
            let cleaned = text.replace(/-/g, '').trim(); 
            
            // 2. Format Kapital awal kalimat
            let formatted = cleaned.charAt(0).toUpperCase() + cleaned.slice(1);
            
            // 3. Format khusus kata 'Gusti'
            formatted = formatted.replace(/\bgusti\b/gi, 'Gusti');
            
            // 4. Akhiri dengan tanda titik jika belum ada tanda baca akhir
            if (!formatted.endsWith('.') && !formatted.endsWith('?')) {
                formatted += '.';
            }
            return formatted;
        }

        // Fungsi merender daftar lengkap pitutur dengan Header Abjad, Nomor, Zebra Striping 1 Kolom
        function renderPituturList() {
            const container = document.getElementById('pituturListContainer');
            container.innerHTML = ''; 

            // Urutkan data berdasarkan abjad tanpa mengubah array asli
            let sortedData = [...pituturData].sort((a, b) => a.localeCompare(b, 'id'));

            // Kelompokkan data berdasarkan huruf pertama
            let groupedData = {};
            sortedData.forEach(originalText => {
                let firstLetter = originalText.trim().charAt(0).toUpperCase();
                if (!groupedData[firstLetter]) {
                    groupedData[firstLetter] = [];
                }
                groupedData[firstLetter].push(originalText);
            });

            let globalCounter = 1; // Penomoran urut pitutur

            // Render per grup abjad
            Object.keys(groupedData).sort().forEach(letter => {
                // Pembungkus Seksi Abjad
                let section = document.createElement('div');
                section.className = 'flex flex-col';

                // Header Abjad Tunggal
                let letterHeader = document.createElement('div');
                letterHeader.className = 'text-2xl font-bold text-amber-800 bg-amber-100/70 px-4 py-2 rounded-md mb-2 border-l-4 border-amber-700 shadow-sm';
                letterHeader.textContent = letter;
                section.appendChild(letterHeader);

                // Kontainer List 1 Kolom
                let ul = document.createElement('ul');
                ul.className = 'flex flex-col rounded-lg overflow-hidden border border-amber-100 shadow-sm';

                groupedData[letter].forEach((originalText, index) => {
                    let displayText = formatDisplayPitutur(originalText);
                    let li = document.createElement('li');
                    
                    // Latar belakang selang-seling (Zebra striping disesuaikan dengan tema UI amber)
                    let bgClass = (index % 2 === 0) ? 'bg-[#fdfbf7]' : 'bg-[#f7f2e7]';
                    
                    li.className = `${bgClass} cursor-pointer hover:bg-amber-200/60 p-3 transition border-b border-amber-100/60 last:border-0 flex items-start gap-3 text-[0.95rem] leading-relaxed text-gray-800`;
                    
                    // Nomor urut & Teks Kalimat
                    li.innerHTML = `
                        <span class="font-bold text-amber-900 min-w-[2.2rem] text-right select-none">${globalCounter}.</span>
                        <span class="flex-grow">${displayText}</span>
                    `;
                    
                    li.onclick = () => {
                        // Tetap memproses data asli (huruf kecil & tanda hubung)
                        searchInput.value = originalText;
                        toggleClearBtn();
                        processTransliteration(originalText);
                        window.scrollTo({ top: 0, behavior: 'smooth' });
                    };
                    
                    ul.appendChild(li);
                    globalCounter++;
                });

                section.appendChild(ul);
                container.appendChild(section);
            });
        }

        // Memuat database pitutur
        fetch('pitutur.json')
            .then(res => res.json())
            .then(data => {
                pituturData = data;
                renderPituturList();
            })
            .catch(err => console.error("Gagal memuat pitutur.json", err));

        // 1. Logika Input & Dropdown Pencarian
        const searchInput = document.getElementById('searchInput');
        const clearBtn = document.getElementById('clearBtn');
        const dropdownList = document.getElementById('dropdownList');

        function toggleClearBtn() {
            if (searchInput.value.length > 0) {
                clearBtn.classList.remove('hidden');
            } else {
                clearBtn.classList.add('hidden');
            }
        }

        searchInput.addEventListener('input', (e) => {
            let val = e.target.value.toLowerCase();
            toggleClearBtn();
            dropdownList.innerHTML = '';
            
            if (!val.trim()) {
                dropdownList.classList.add('hidden');
                processTransliteration('');
                return;
            }

            let matches = pituturData.filter(p => {
                let words = p.toLowerCase().split(/[\s,.-]+/);
                return words.some(w => w.startsWith(val));
            });

            if (matches.length > 0) {
                dropdownList.classList.remove('hidden');
                matches.forEach(m => {
                    let div = document.createElement('div');
                    div.className = 'p-4 hover:bg-amber-50 cursor-pointer border-b border-gray-100 last:border-0 text-gray-700 font-medium transition';
                    div.textContent = m;
                    
                    div.onclick = () => {
                        searchInput.value = m;
                        toggleClearBtn();
                        dropdownList.classList.add('hidden');
                        processTransliteration(m);
                    };
                    dropdownList.appendChild(div);
                });
            } else {
                dropdownList.classList.add('hidden');
            }
            
            processTransliteration(e.target.value);
        });

        clearBtn.addEventListener('click', () => {
            searchInput.value = '';
            toggleClearBtn();
            dropdownList.classList.add('hidden');
            processTransliteration('');
            searchInput.focus();
        });

        document.addEventListener('click', (e) => {
            if (!searchInput.contains(e.target) && !dropdownList.contains(e.target) && !clearBtn.contains(e.target)) {
                dropdownList.classList.add('hidden');
            }
        });

        // 2. Logika Kontrol Slider
        const fontSizeSlider = document.getElementById('fontSizeSlider');
        const lineHeightSlider = document.getElementById('lineHeightSlider');
        const boxes = document.querySelectorAll('.aksara-box');

        fontSizeSlider.addEventListener('input', (e) => {
            let val = e.target.value;
            document.getElementById('fontSizeVal').textContent = val;
            boxes.forEach(b => b.style.fontSize = val + 'rem');
        });

        lineHeightSlider.addEventListener('input', (e) => {
            let val = e.target.value;
            document.getElementById('lineHeightVal').textContent = val;
            boxes.forEach(b => b.style.lineHeight = val);
        });

        // 3. Logika Salin Teks
        function copyAksara(boxId, btn) {
            let text = document.getElementById(boxId).innerText;
            if (!text) return;
            navigator.clipboard.writeText(text).then(() => {
                let oriText = btn.innerText;
                btn.innerText = 'Tersalin!';
                btn.classList.add('bg-green-600');
                btn.classList.remove('bg-amber-600');
                setTimeout(() => { 
                    btn.innerText = oriText; 
                    btn.classList.add('bg-amber-600');
                    btn.classList.remove('bg-green-600');
                }, 2000);
            });
        }

        // 4. Sandboxing Skrip Transliterasi via Iframe
        window.addEventListener('message', (e) => {
            if (e.data && e.data.id && pendingRequests[e.data.id]) {
                pendingRequests[e.data.id](e.data.result);
                delete pendingRequests[e.data.id];
            }
        });

        function askIframe(win, funcName, text) {
            return new Promise(resolve => {
                if (!win) { resolve(''); return; }
                let id = ++reqId;
                pendingRequests[id] = resolve;
                win.postMessage({ id, funcName, text }, '*');
            });
        }

        function prepareTextWithAdegAdeg(rawText) {
            let text = rawText.trim();
            if (!text) return '';
            if (!text.startsWith('꧋')) {
                text = '꧋' + text;
            }
            if (!text.endsWith('.') && !text.endsWith('꧉') && !text.endsWith('?')) {
                text = text + '.';
            }
            return text;
        }

        async function processTransliteration(text) {
            if (!text || !text.trim()) {
                document.getElementById('outKbj').innerText = '';
                document.getElementById('outSriwedari').innerText = '';
                document.getElementById('outKawi').innerText = '';
                return;
            }

            let preparedText = prepareTextWithAdegAdeg(text);
            
            let resKbj = await askIframe(winKbj, 'transliterasiKalimat', preparedText);
            let resSriwedari = await askIframe(winSriwedari, 'transliterasiKalimat', preparedText);
            let resKawi = await askIframe(winKawi, 'transliterateKawi', preparedText);
            
            if (resSriwedari) {
                resSriwedari = resSriwedari.replace(/ꦩꦼꦩꦪꦸ/g, 'ꦩꦩꦪꦸ');
                resSriwedari = resSriwedari.replace(/ꦏꦼꦠꦫ/g, 'ꦏꦠꦫ');
                resSriwedari = resSriwedari.replace(/ꦠꦺꦴꦤ꧀ꦥ/g, 'ꦠꦤ꧀ꦥ');
                resSriwedari = resSriwedari.replace(/ꦏꦼꦠꦩꦤ꧀/g, 'ꦏꦠꦩꦤ꧀');
                resSriwedari = resSriwedari.replace(/ꦏꦼꦱꦼꦭꦫꦱ꧀ꦱꦤ꧀/g, 'ꦏꦱꦭꦫꦱ꧀ꦱꦤ꧀');
                resSriwedari = resSriwedari.replace(/ꦤꦼꦒꦫꦶ/g, 'ꦤꦒꦫꦶ');
                resSriwedari = resSriwedari.replace(/ꦱꦼꦒꦫ/g, 'ꦱꦒꦫ');
            }

            document.getElementById('outKbj').innerText = resKbj || '';
            document.getElementById('outSriwedari').innerText = resSriwedari || '';
            document.getElementById('outKawi').innerText = resKawi || '';
        }

        function createIframe(scriptSrc) {
            return new Promise(resolve => {
                let iframe = document.createElement('iframe');
                iframe.style.display = 'none';
                document.body.appendChild(iframe);
                
                let doc = iframe.contentWindow.document;
                let baseTag = doc.createElement('base');
                baseTag.href = window.location.href;
                doc.head.appendChild(baseTag);
                
                const dummyIds = ['textInput', 'previewOutput', 'fontSelect', 'fontSizeRange', 'fontSizeVal', 'lineHeightRange', 'lineHeightVal', 'charCount', 'copyBtn', 'clearBtn'];
                let dummies = dummyIds.map(id => `<input id="${id}">`).join('');
                doc.body.innerHTML = dummies;
                
                let scriptListener = doc.createElement('script');
                scriptListener.textContent = `
                    window.addEventListener('message', function(e) {
                        let data = e.data;
                        let res = '';
                        try {
                            if (typeof window[data.funcName] === 'function') {
                                res = window[data.funcName](data.text);
                            }
                        } catch(err) { console.error(err); }
                        window.parent.postMessage({ id: data.id, result: res }, '*');
                    });
                `;
                doc.head.appendChild(scriptListener);

                let scriptTarget = doc.createElement('script');
                scriptTarget.src = scriptSrc;
                scriptTarget.onload = () => resolve(iframe.contentWindow);
                scriptTarget.onerror = () => resolve(iframe.contentWindow);
                doc.head.appendChild(scriptTarget);
            });
        }
        
        async function init() {
            winKbj = await createIframe('kbj.js');
            winSriwedari = await createIframe('sriwedari.js');
            winKawi = await createIframe('carakawi.js');
        }

        init();
    </script>
</body>
</html>
